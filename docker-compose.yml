# 로컬/제출용 self-contained 구성.
#   docker compose up --build   →  http://localhost:${APP_PORT:-8080}
#
# 서버 배포는 docker-compose.prod.yml 을 쓴다 (기존 Postgres·MinIO 인스턴스에 연결).
# 로컬 포트는 흔한 충돌(5432, 9000)을 피해 잡아두었다.

services:
  db:
    # ★ 17 을 유지한다. 배포 대상 서버가 17.10 이기도 하지만, 18 로 올리면 이 구성 자체가 깨진다.
    #
    #   postgres:18 이미지는 PGDATA 를 /var/lib/postgresql/18/docker 로 옮겼고,
    #   아래처럼 /var/lib/postgresql/data 에 볼륨이 붙어 있으면 그것을 "unused mount/volume" 으로
    #   판정하고 기동을 거부한다. 빈 볼륨이어도 거부한다 — 실측으로 확인했다.
    #
    #   18 로 올리려면 마운트 지점을 /var/lib/postgresql 로 바꿔야 한다.
    #   그 전까지 이미지 태그만 올리면 db 가 뜨지 않고, depends_on 때문에 app 도 뜨지 않는다.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extguard}
      POSTGRES_USER: ${POSTGRES_USER:-extguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extguard}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extguard} -d ${POSTGRES_DB:-extguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 배포 서버에서 도는 릴리스와 같은 태그로 고정한다. latest 는 테스트 이미지와
    # 배포 이미지가 조용히 갈라지게 만든다 — Postgres 에서 이미 겪었다.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-19100}:9000"
      - "${MINIO_CONSOLE_PORT:-19101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷을 만드는 일회성 컨테이너.
  #
  # ★ 애플리케이션은 버킷을 자동 생성하지 않는다(기동 실패로 끝난다). 이름 오타가 조용히
  #   새 버킷을 만들고, 그 버킷의 공개 정책을 코드가 보증해야 하기 때문이다. 그렇다고
  #   `docker compose up` 이 절대 안 뜨면 평가자가 실행할 방법이 없다.
  #
  #   그래서 버킷 준비는 <b>인프라의 몫</b>으로 옮긴다. 애플리케이션은 여전히 짐작하지 않고,
  #   구성은 자기 완결적이 된다. anonymous 를 none 으로 명시하는 것도 여기서 한다 —
  #   public-read 버킷 하나면 저장형 XSS 이므로 기본값에 기대지 않는다.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-extguard-uploads}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
             mc mb --ignore-existing local/$$MINIO_BUCKET &&
             mc anonymous set none local/$$MINIO_BUCKET"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-extguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-extguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-extguard}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-extguard-uploads}
      # 필터가 32자 이상을 요구한다(기동 시점 검증). 이 기본값은 로컬 데모 전용이며
      # 공개 배포에서는 반드시 APP_ADMIN_TOKEN 을 넘겨 덮어써야 한다.
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-local-demo-token-do-not-use-in-production}
      APP_POLICY_ALLOW_EXTENSIONLESS: ${APP_POLICY_ALLOW_EXTENSIONLESS:-false}
      APP_UPLOAD_MAX_SIZE: ${APP_UPLOAD_MAX_SIZE:-10MB}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
