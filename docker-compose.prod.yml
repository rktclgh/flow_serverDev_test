# 서버 배포용 override.
#
#   로컬에서:  bash deploy/deploy.sh
#   서버에서:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ★ 서버에서 빌드하지 않는다. 이미지는 로컬에서 만들어 Docker Hub 에 올리고 서버는 받아서
#   띄우기만 한다. 서버에서 빌드하면 저장소 전체와 빌드 도구가 서버에 있어야 하고, 빌드가
#   실패하면 그 순간 서비스도 못 뜬다. 받아온 이미지는 실패할 자리가 없다.
#
# 기존 운영 인스턴스(Postgres·vlainter-minio)를 재사용하지 않고 전용 컨테이너를 띄운다.
#   - 운영 중인 다른 서비스에 영향을 주지 않는다
#   - 과제 종료 후 `docker compose down -v` 한 번으로 완전히 정리된다
#   - vlainter-minio 는 127.0.0.1 에만 바인딩되어 있어 다른 컨테이너에서 접근할 수도 없다
#
# db·minio 포트는 호스트에 노출하지 않는다. app 만 127.0.0.1 로 열어 nginx 가 프록시한다.

services:
  db:
    ports: []

  minio:
    ports: []

  app:
    # build 를 덮어쓴다. IMAGE_TAG 가 없으면 뜨지 않게 두어, 태그를 빠뜨린 배포가
    # 조용히 latest 로 흘러가지 않게 한다.
    image: "${IMAGE:?IMAGE 를 지정해야 합니다. 예 songchih/extguard 콜론 커밋SHA}"
    build: !reset null
    pull_policy: always
    ports:
      - "127.0.0.1:18081:8080"
    restart: unless-stopped
