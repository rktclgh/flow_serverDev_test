# 배치: /etc/nginx/conf.d/extguard-limits.conf
#
# limit_req_zone 은 http 컨텍스트에만 선언할 수 있어 vhost 파일에 넣을 수 없다.
# conf.d/ 는 nginx.conf 의 http 블록에서 include 되므로 여기에 둔다.
# 다른 vhost 에 영향을 주지 않도록 zone 이름에 서비스명을 붙였다.
#
# 업로드 API 가 완전 공개이므로(과제의 "누구나 접속 가능" 요구) 남용 방어가 필요하다.
# 애플리케이션 검증은 multipart 파싱 *뒤에* 실행되기 때문에, 차단될 파일이라도
# 파싱 비용은 이미 발생한다. 근본 완화는 이렇게 프록시 계층에서 거는 것이다. (SPEC §10.2)

# ★ IP 당 분당 300회. 이 계층은 "명백한 남용" 만 막는다.
#
#   처음에는 20r/m(3초에 1개)이었다. 화면이 파일을 큐에 담아 순차 업로드하면서 이 값이
#   시연을 끊는다는 것이 드러났다 — burst 5 를 넘기는 6번째 파일부터 막힌다. 게다가
#   limit_req 응답은 HTML 이고 앱 로그에도 감사에도 남지 않아, 사용자는 이유를 알 수 없다.
#
#   정상 범위 제어는 앱이 한다(IP 당 60r/m, 429 + Retry-After JSON). 사용자에게 이유를
#   설명해야 하는 거부는 앱이 해야 한다. 크기 제한에서 앱(10MB)이 nginx(12MB)보다 조인 것과
#   같은 방향이다. SPEC §10.4.
limit_req_zone $binary_remote_addr zone=extguard_upload:10m rate=300r/m;

# 초과 시 503(서버 잘못)이 아니라 429(클라이언트가 너무 빠름)로 답한다.
# 프론트 래퍼가 429 만 Retry-After 로 재시도하고 503 은 다르게 다루므로 의미가 맞아야 한다.
limit_req_status 429;

# 정책 변경은 더 조인다. 관리 토큰이 있어도 무차별 시도를 억제한다.
limit_req_zone $binary_remote_addr zone=extguard_policy:10m rate=60r/m;

# 동시 연결 수 — 느린 업로드로 커넥션을 점유하는 방식에 대응
limit_conn_zone $binary_remote_addr zone=extguard_conn:10m;
