# flowtest.rktclgh.site — ExtGuard
#
# 배치: /etc/nginx/sites-available/flowtest.rktclgh.site.conf
#       ln -s ../sites-available/flowtest.rktclgh.site.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# ieum.rktclgh.site.conf 를 베이스로 하되 아래를 의도적으로 제외했다:
#   - map $http_upgrade $connection_upgrade
#     → 다른 vhost 에 이미 정의되어 있다. 중복 정의하면 nginx 가 기동에 실패한다.
#   - WebSocket / SSE location
#     → 이 서비스는 쓰지 않는다.

server {
    listen 80;
    listen [::]:80;
    server_name flowtest.rktclgh.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flowtest.rktclgh.site;

    ssl_certificate /etc/cloudflare/rktclgh.site.pem;
    ssl_certificate_key /etc/cloudflare/rktclgh.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare 프록시 뒤에 있으므로 실제 클라이언트 IP 를 복원한다.
    # 이걸 빼면 upload_audit.client_ip 에 Cloudflare 대역만 남아 감사 로그가 무의미해진다. (SPEC §3.2)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # SPEC §10.1 — 크기 제한 4계층 중 nginx 계층.
    # Spring(10MB)보다 약간 크게 잡아 "누가 막았는지"를 응답으로 구분할 수 있게 한다.
    # 여기서 잘리면 413 이 HTML 로 나가고 JSON 이 아니다 — 프론트가 별도 처리해야 한다.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 노출 표면 축소. 앱은 Actuator 를 쓰지 않고 /health 를 직접 제공한다.
    location ^~ /actuator  { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui  { return 404; }

    # ── 업로드: 공개 API 라 남용 방어가 필요하다 ──────────────────────
    # zone 정의는 conf.d/extguard-limits.conf 에 있다 (http 컨텍스트 전용).
    # 앱의 검증은 multipart 파싱 뒤에 실행되므로, 차단될 파일이라도 파싱 비용은 이미 발생한다.
    # 그 비용을 앞단에서 끊는 유일한 지점이 여기다.
    location = /api/files {
        limit_req  zone=extguard_upload burst=20 nodelay;
        limit_conn extguard_conn 5;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 정책 변경: 관리 토큰이 있어도 무차별 시도를 억제한다 ──────────
    location ^~ /api/extensions {
        limit_req zone=extguard_policy burst=10 nodelay;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
